name: Sprawdzanie cen lotów

on:
  schedule:
    # 3x dziennie (czas UTC): ok. 7:13, 15:13, 23:13 czasu polskiego zimą
    - cron: "13 6,14,22 * * *"
  workflow_dispatch: {}   # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 128 zapytań z przerwami trwa ok. 15–20 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pobierz ceny
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # potrzebny tylko przy provider: serpapi
        run: python collect.py

      - name: Zbuduj raport
        if: always()
        run: python report.py

      - name: Zapisz dane do repo
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data reports
          git add data reports
          git diff --cached --quiet || git commit -m "Ceny: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
